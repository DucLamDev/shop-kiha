# Install only after checking that this domain has no conflicting server block.
# Certbot adds the TLS listener and HTTP -> HTTPS redirect afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name noithatkiha.vn;

    server_tokens off;
    client_max_body_size 105m;
    client_body_timeout 300s;

    # Direct proxy preserves streaming uploads and video Range requests.
    # Replace forwarded IP headers so public clients cannot forge rate-limit IPs.
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
